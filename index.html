<style>
:root{--bg:#f6f8fb;--fg:#17202e;--card:#fff;--bd:#d7dde6;--pri:#1f3a5f;--acc:#2a9d8f;--am:#e9a23b;--mut:#5d6b7e;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0f1621;--fg:#e8edf4;--card:#18212f;--bd:#2c3849;--pri:#7fa6d9;--acc:#4cc2b2;--am:#f0b95c;--mut:#9aa8bb}}
*{box-sizing:border-box}body{margin:0;font:16px/1.5 system-ui,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--fg)}
header{background:#4a2e20;color:#fff;border-bottom:3px solid #d9a93a}.lg{height:40px;width:40px;vertical-align:middle;margin-right:8px;background:#fff;border-radius:50%}.hd{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.w{max-width:980px;margin:auto;padding:12px 16px}main.w{padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
button,.btn{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;margin:2px}
button.s{background:transparent;color:inherit;border:1px solid var(--bd)}header button{background:#2a9d8f}
input,select,textarea{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%;margin:3px 0}
input[type=radio],input[type=checkbox]{width:auto}label{display:block}.sw{display:inline-block;margin:0 6px}
.chip{display:inline-block;font-size:12px;font-weight:700;color:#fff;border-radius:20px;padding:1px 10px;margin-right:6px}
.bar{background:var(--bd);height:8px;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.ok{background:#d5efea;color:#12453f;padding:10px;border-radius:8px;margin:10px 0}.mut{color:var(--mut);font-size:14px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left}
nav.t button{background:transparent;color:inherit;border:1px solid var(--bd)}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:0 1 auto}.g1{flex:1!important}
h2,h3{color:var(--pri)}.bad{color:#c8553d}
</style>
</head>

function net(on){S.on=on;if(on){let n=0;Object.values(D.p).forEach(m=>Object.values(m).forEach(p=>{if(p.pend){p.pend=0;n++}}));if(n)S.msg=`Conexión restablecida: se sincronizaron ${n} envíos.`;save()}else S.msg='Modo sin conexión: solo se abren los recursos descargados y los envíos quedan pendientes.';r()}
const V={};
V.home=()=>myC().map(c=>{const p=pct(c,S.u);return`<div class=card><b>${esc(c.name)}</b><div class=bar><i style="width:${p}%"></i></div><span class=mut>${S.u.role==='Estudiante'?p+' % completado':c.s.length+' estudiantes'}</span><br><button onclick="nav('course','${c.id}')">Abrir curso</button></div>`}).join('')||'<p>Sin cursos.</p>';
V.course=()=>{const c=D.c.find(x=>x.id===S.c),t=S.u.role==='Docente';let h=`<h2>${esc(c.name)}</h2><button class=s onclick="nav('home')">← Mis cursos</button>`;
c.us.forEach(u=>{h+=`<div class=card><h3>${esc(u.t)}</h3>`;u.a.forEach(a=>{const p=pr(a);h+=`<div class=row><span class=g1>${chip(a.b)}<b>${TY[a.type]}:</b> ${esc(a.t)} ${p.done?'✔':''}${p.pend?' <i class=mut>(pendiente de sincronizar)</i>':''}</span>${S.u.role==='Estudiante'?`<button class=s onclick="dl('${a.id}')">${p.dl?'Descargado ✓':'Descargar'}</button>`:''}<button onclick="nav('act',null,'${a.id}')">Abrir</button></div>`});h+='</div>'});
if(t)h+=`<div class=card><h3>Agregar actividad (docente)</h3><select id=nu>${c.us.map((u,i)=>`<option value=${i}>${esc(u.t)}</option>`).join('')}</select><div class=row><select id=ny class=g1>${Object.entries(TY).map(([k,v])=>`<option value=${k}>${v}</option>`).join('')}</select><select id=nb class=g1>${B.map((b,i)=>`<option value=${i}>${b}</option>`).join('')}</select></div><input id=nt placeholder="Título"><textarea id=nd rows=4 placeholder="Contenido. En cuestionarios: una pregunta por línea con el formato  Pregunta|opción 1|opción 2|opción 3|opción 4|n.º de la correcta (1-4)"></textarea><button onclick="addAct('${c.id}')">Agregar</button></div>`;return h};
function dl(id){const[a]=find(id),p=pr(a);p.dl=!p.dl;S.msg=p.dl?'Recurso descargado: disponible sin conexión.':'Descarga eliminada.';save();r()}
function addAct(cid){const c=D.c.find(x=>x.id===cid),ty=$('#ny').value,t=$('#nt').value.trim();if(!t){S.msg='<span class=bad>Escribe un título.</span>';return r()}let qs=[];const body=$('#nd').value;if(ty==='quiz'){qs=body.split('\n').map(l=>l.split('|')).filter(x=>x.length>=6).map(x=>({q:x[0],o:x.slice(1,5),a:Math.max(0,Math.min(3,(+x[5]||1)-1))}));if(!qs.length){S.msg='<span class=bad>Escribe al menos una pregunta con el formato indicado.</span>';return r()}}
D.n++;c.us[+$('#nu').value].a.push({id:'a'+D.n,type:ty,t,b:+$('#nb').value,body:ty==='quiz'?'':body,qs});S.msg='Actividad agregada.';save();r()}
V.act=()=>{const[a,c]=find(S.a),p=pr(a),st=S.u.role==='Estudiante';let h=`<button class=s onclick="nav('course','${c.id}')">← ${esc(c.name)}</button><div class=card><h2>${chip(a.b)}${esc(a.t)}</h2>`;
if(st&&!S.on&&!p.dl)return h+'<p class=bad>Sin conexión: este recurso no está descargado. Conéctate y pulsa «Descargar» para usarlo sin conexión.</p></div>';
if(a.body)h+=`<p>${esc(a.body)}</p>`;
if(a.type==='lesson'&&st)h+=`<button onclick="done('${a.id}')">${p.done?'Completada ✔':'Marcar como completada'}</button>`;
if(a.type==='quiz'){if(st){if(p.done)h+=`<p><b>Calificación: ${p.score} / 5</b></p>`+(p.fb||[]).map(x=>`<p>${esc(x)}</p>`).join('')+`<button class=s onclick="retry('${a.id}')">Reintentar</button>`;else h+=a.qs.map((q,i)=>`<p><b>${i+1}. ${esc(q.q)}</b></p>`+q.o.map((o,j)=>`<label><input type=radio name=q${i} value=${j}> ${esc(o)}</label>`).join('')).join('')+`<button onclick="sendQ('${a.id}')">Enviar</button>`}else h+=roster(c,a)}
if(a.type==='task'){if(st){h+=p.sub?`<p class=mut>Tu entrega: ${esc(p.sub)}</p>`:'';h+=p.score!=null?`<p><b>Nota: ${p.score} / 5</b> · ${esc(p.fbk||'')}</p>`:p.done?'<p class=mut>Entregada. Esperando calificación.</p>':'';h+=`<textarea id=sub rows=4 placeholder="Escribe tu respuesta"></textarea><button onclick="sendT('${a.id}')">Entregar</button>`}else h+=roster(c,a)}
if(a.type==='forum'){const ps=D.f[a.id]||[];h+=ps.map(x=>`<div class=card><b>${esc(x.n)}</b> <span class=mut>${new Date(x.ts).toLocaleString()}</span><br>${esc(x.t)}</div>`).join('')+`<textarea id=fp rows=3 placeholder="Tu aporte"></textarea><button onclick="post('${a.id}')">Publicar</button>`}
return h+'</div>'};
function roster(c,a){if(a.type==='quiz')return`<table><tr><th>Estudiante</th><th>Nota</th></tr>${c.s.map(id=>{const u=D.u.find(x=>x.id===id),p=pr(a,u);return`<tr><td>${esc(u.name)}</td><td>${p.done?p.score:'—'}</td></tr>`}).join('')}</table>`;
return c.s.map(id=>{const u=D.u.find(x=>x.id===id),p=pr(a,u);return`<div class=card><b>${esc(u.name)}</b>: ${p.sub?esc(p.sub):'<i class=mut>sin entrega</i>'}${p.sub?`<div class=row><input id=n_${u.id} type=number min=0 max=5 step=0.1 placeholder="Nota 0-5" value="${p.score??''}"><input id=f_${u.id} class=g1 placeholder="Retroalimentación" value="${esc(p.fbk||'')}"><button onclick="grade('${a.id}','${u.id}')">Calificar</button></div>`:''}</div>`}).join('')}
function done(id){const[a]=find(id),p=pr(a);p.done=1;p.pend=!S.on;save();r()}
function retry(id){const[a]=find(id);D.p[S.u.id][a.id]={dl:pr(a).dl};save();r()}
function sendQ(id){const[a]=find(id);let ok=0,fb=[];a.qs.forEach((q,i)=>{const x=document.querySelector(`input[name=q${i}]:checked`),v=x?+x.value:-1;if(v===q.a){ok++;fb.push('✔ '+q.q)}else fb.push('✘ '+q.q+' → Respuesta correcta: '+q.o[q.a])});const p=pr(a);p.done=1;p.score=+(ok/a.qs.length*5).toFixed(1);p.fb=fb;p.pend=!S.on;save();r()}
function sendT(id){const[a]=find(id),t=$('#sub').value.trim();if(!t){S.msg='<span class=bad>Escribe tu respuesta.</span>';return r()}const p=pr(a);p.sub=t;p.done=1;p.pend=!S.on;S.msg=S.on?'Entrega registrada.':'Entrega guardada; se enviará al recuperar la conexión.';save();r()}
function grade(aid,uid){const[a]=find(aid),u=D.u.find(x=>x.id===uid),p=pr(a,u),n=parseFloat($('#n_'+uid).value);if(isNaN(n)||n<0||n>5){S.msg='<span class=bad>La nota debe estar entre 0 y 5.</span>';return r()}p.score=n;p.fbk=$('#f_'+uid).value;S.msg='Calificación guardada.';save();r()}
function post(id){const t=$('#fp').value.trim();if(!t)return;(D.f[id]=D.f[id]||[]).push({n:S.u.name,t,ts:Date.now()});const[a]=find(id);pr(a).done=1;save();r()}
V.grades=()=>`<h2>Mis calificaciones</h2>`+myC().map(c=>`<div class=card><b>${esc(c.name)}</b><table><tr><th>Actividad</th><th>Nota</th><th>Comentarios</th></tr>${acts(c).filter(a=>a.type!=='lesson'&&a.type!=='forum').map(a=>{const p=pr(a);return`<tr><td>${esc(a.t)}</td><td>${p.score??'—'}</td><td>${esc(p.fbk||'')}</td></tr>`}).join('')}</table></div>`).join('');
V.survey=()=>{const sv=D.sv[S.u.id];if(sv)return`<div class=card><h2>Gracias por responder</h2><p>Tu puntaje SUS: <b>${sv.sus}</b> / 100 (referencia de aceptabilidad: 68).</p><button class=s onclick="delete D.sv[S.u.id];save();r()">Responder de nuevo</button></div>`;
const L=(n,i)=>`<label>${i+1}. ${esc(n)}<br>${[1,2,3,4,5].map(v=>`<label style="display:inline-block;margin-right:12px"><input type=radio name=@${i} value=${v}>${v}</label>`).join('')}</label>`;
return`<div class=card><h2>Encuesta de usabilidad (SUS) y aceptación (TAM)</h2><p class=mut>1 = totalmente en desacuerdo · 5 = totalmente de acuerdo</p><h3>SUS</h3>${SUSQ.map((q,i)=>L(q,i).replace(/@/g,'s')).join('')}<h3>TAM</h3>${TAMQ.map((q,i)=>L(q,i).replace(/@/g,'t')).join('')}<button onclick="sendS()">Enviar</button></div>`};
function sendS(){const g=(p,n)=>Array.from({length:n},(_,i)=>{const x=document.querySelector(`input[name=${p}${i}]:checked`);return x?+x.value:null});const s=g('s',10),t=g('t',12);if(s.includes(null)||t.includes(null)){S.msg='<span class=bad>Responde todos los ítems.</span>';return r()}
const sus=s.reduce((a,v,i)=>a+(i%2===0?v-1:5-v),0)*2.5;D.sv[S.u.id]={sus,tam:+avg(t).toFixed(2),role:S.u.role};save();r()}
V.rep=()=>{let h='<h2>Reportes de uso y desempeño</h2>';const bar=p=>`<div class=bar><i style="width:${p}%"></i></div>`;
myC().forEach(c=>{const A=acts(c),n=c.s.length,dn=c.s.reduce((s,id)=>s+A.filter(a=>pr(a,{id}).done).length,0),sc=c.s.flatMap(id=>A.map(a=>pr(a,{id}).score).filter(x=>x!=null)),act=new Set(D.l.filter(l=>c.s.includes(l.u)&&A.some(a=>a.id===l.a)).map(l=>l.u)).size,p=A.length&&n?Math.round(dn/(A.length*n)*100):0;
h+=`<div class=card><b>${esc(c.name)}</b><div class=grid><div><span class=mut>Estudiantes activos</span><h3>${act} / ${n}</h3></div><div><span class=mut>Actividades completadas</span><h3>${p} %</h3>${bar(p)}</div><div><span class=mut>Promedio de notas</span><h3>${sc.length?avg(sc).toFixed(1):'—'}</h3></div></div></div>`});
const sv=Object.values(D.sv),su=sv.map(x=>x.sus),fav=sv.length?Math.round(sv.filter(x=>x.tam>=4).length/sv.length*100):0;
h+=`<div class=card><b>Usabilidad y aceptación</b><div class=grid><div><span class=mut>Puntaje SUS promedio (meta ≥ 68)</span><h3 class="${su.length&&avg(su)<68?'bad':''}">${su.length?avg(su).toFixed(1):'—'}</h3></div><div><span class=mut>Aceptación TAM favorable (meta ≥ 70 %)</span><h3>${sv.length?fav+' %':'—'}</h3></div><div><span class=mut>Respuestas</span><h3>${sv.length}</h3></div></div></div>`;
h+=`<div class=card><b>Accesos registrados:</b> ${D.l.length}</div>`;return h};
V.admin=()=>`<h2>Administración</h2><div class=card><h3>Usuarios y roles</h3><table><tr><th>Nombre</th><th>Correo</th><th>Rol</th></tr>${D.u.map(u=>`<tr><td>${esc(u.name)}</td><td>${esc(u.email)}</td><td><select onchange="role('${u.id}',this.value)">${['Administrador','Docente','Estudiante','Directivo'].map(x=>`<option ${x===u.role?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join('')}</table></div>
<div class=card><h3>Carga masiva</h3><p class=mut>Una persona por línea: nombre,correo,rol. Clave inicial 1234. Los estudiantes se matriculan en todos los cursos.</p><textarea id=bulk rows=4 placeholder="Ana Pérez,ana@elcarmelo.edu.co,Estudiante"></textarea><button onclick="bulk()">Crear usuarios</button></div>
<div class=card><h3>Copia de respaldo</h3><button onclick="bk()">Descargar copia (JSON)</button> <label class=btn>Restaurar copia<input type=file accept=.json hidden onchange="rs(this)"></label> <button class=s onclick="if(confirm('¿Borrar todos los datos y restaurar la demostración?')){D=seed();save();S.msg='Datos de demostración restaurados.';r()}">Restablecer demostración</button></div>`;
function role(id,v){D.u.find(u=>u.id===id).role=v;const c0=D.c;D.c.forEach(c=>{c.s=c.s.filter(x=>x!==id);if(v==='Estudiante')c.s.push(id)});save();S.msg='Rol actualizado.';r()}
function bulk(){let n=0;$('#bulk').value.split('\n').forEach(l=>{const[x,e,ro]=l.split(',').map(s=>s.trim());if(x&&e&&['Administrador','Docente','Estudiante','Directivo'].includes(ro)&&!D.u.some(u=>u.email===e)){const id='u'+(Date.now()+n);D.u.push({id,name:x,email:e,role:ro,pw:'1234'});if(ro==='Estudiante')D.c.forEach(c=>c.s.push(id));n++}});S.msg=n+' usuarios creados.';save();r()}
function bk(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='copia_aula_virtual_'+new Date().toISOString().slice(0,10)+'.json';a.click();S.msg='Copia descargada.';r()}
function rs(i){const f=i.files[0];if(!f)return;const R=new FileReader();R.onload=()=>{try{const x=JSON.parse(R.result);if(!x.c||!x.u)throw 0;D=x;save();S.msg='Copia restaurada.'}catch(e){S.msg='<span class=bad>Archivo de copia no válido.</span>'}r()};R.readAsText(f)}
load();r();
</script>
</body>
</html>
